spring.application.name=documind-ai

# --- Security ---
spring.security.user.name=admin
spring.security.user.password=password

# --- Database (Docker) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/documind
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate & JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Flyway ---
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true 

# --- NVIDIA AI STRATEGY ---
# We use the OpenAI client for both because NVIDIA's API is OpenAI-compatible
spring.ai.openai.base-url=https://integrate.api.nvidia.com

# --- Disable unused OpenAI features to prevent "Missing API Key" errors ---
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.image.enabled=false

# --- Ensure your main keys are set for the clients you ARE using ---
spring.ai.openai.api-key=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

# --- Chat Model: NVIDIA (Solar 10.7B) ---
spring.ai.openai.chat.enabled=true
spring.ai.openai.chat.api-key=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
spring.ai.openai.chat.options.model=google/gemma-4-31b-it
spring.ai.openai.chat.options.temperature=1.0

# --- Embedding Model: NVIDIA (NV-Embed-V1) ---
spring.ai.openai.embedding.enabled=true
# Note: Since Spring AI usually uses one API key for the whole OpenAI client, 
# if your embedding key is different from your chat key, you may need to 
# use the same key for both or configure a separate bean. 
# Usually, one NVAPI key works for all NVIDIA models.
spring.ai.openai.embedding.api-key=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
spring.ai.openai.embedding.options.model=nvidia/nv-embed-v1

# Disable Ollama entirely
# spring.ai.ollama.embedding.enabled=false
# spring.ai.ollama.chat.enabled=false

# --- Vector Store (PGVector) ---
# NV-Embed-V1 typically uses 1024 dimensions (check if 768 is correct for your specific model version)
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# --- Logging & Management ---
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console="%d{HH:mm:ss} [%X{requestId}] [tenant:%X{tenantId}] %-5level %logger - %msg%n"

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
management.endpoints.web.exposure.include=health,metrics,info